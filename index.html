<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>高鐵列車即時位置與發車資訊</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{--bg:#eef1f2;--card:#fff;--ink:#1d2a31;--mute:#7a8991;--org:#f26a1b;--orgl:#ffe3d1;--nb:#2f6fb0;--sb:#17803f;--ln:#cfd6da;--chip:#f3f5f6;--ok:#1a9a5b;--warn:#d98a00;--bad:#d1342f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171b;--card:#192228;--ink:#e8edf0;--mute:#8fa0aa;--orgl:#4a2c1a;--nb:#6aa9e6;--sb:#2fa866;--ln:#34434b;--chip:#222d34}}
:root[data-theme="dark"]{--bg:#10171b;--card:#192228;--ink:#e8edf0;--mute:#8fa0aa;--orgl:#4a2c1a;--nb:#6aa9e6;--sb:#2fa866;--ln:#34434b;--chip:#222d34}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;display:flex;justify-content:center;padding:16px 12px 40px}
main{width:100%;max-width:480px}
.top{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.top h1{margin:0 0 8px;font-size:1.1rem;font-weight:900}
.big{display:flex;align-items:baseline;gap:8px}
.big b{font-size:3rem;line-height:1;font-weight:900;color:var(--org);font-variant-numeric:tabular-nums}
.big span{font-size:1rem;font-weight:700}
.clock{margin-left:auto;font-size:1.4rem;font-weight:900;font-variant-numeric:tabular-nums}
.bk{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.bk div{background:var(--chip);border-radius:8px;padding:6px 8px;font-size:.72rem;color:var(--mute)}
.bk b{display:block;font-size:1.15rem;color:var(--ink);font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tg{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;padding:3px 9px;border-radius:99px;background:var(--chip);color:var(--mute)}
.tg.live,.tg.ok{color:var(--ok)}.tg.demo,.tg.warn{color:var(--warn)}.tg.unk{color:var(--mute)}
.ring{width:10px;height:10px;border:2.5px solid currentColor;border-radius:50%;display:inline-block}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.ctl button{all:unset;box-sizing:border-box;cursor:pointer;font-size:.8rem;padding:6px 12px;border-radius:99px;background:var(--chip)}
.ctl button[aria-pressed="true"]{background:var(--org);color:#fff;font-weight:700}
.ctl button:focus-visible,.search input:focus-visible,.search button:focus-visible{outline:2px solid var(--org);outline-offset:2px}
.search{display:flex;gap:6px;margin-top:10px}
.search input{flex:1;min-width:0;padding:7px 12px;border:0;border-radius:99px;background:var(--chip);color:var(--ink);font:inherit;font-size:.85rem}
.search button{all:unset;box-sizing:border-box;cursor:pointer;font-size:.8rem;padding:6px 14px;border-radius:99px;background:var(--org);color:#fff;font-weight:700}
#qmsg{color:var(--bad);font-size:.74rem;min-height:1em;margin-top:2px}
.lg{display:flex;gap:14px;font-size:.74rem;color:var(--mute);margin:0 4px 8px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.empty{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;text-align:center;color:var(--mute);font-size:.85rem}
.map{position:relative;background:var(--card);border-radius:14px;overflow:hidden}
#mapIn{position:relative;transform-origin:0 0}
.ln{position:absolute;width:4px;margin-left:-2px;background:var(--ln);border-radius:2px}
.sb{position:absolute;background:var(--card);border-radius:8px}
.tk{position:absolute;width:4px;margin-left:-2px;background:var(--ptrk);border-radius:2px}
.tk.m{background:var(--ln)}
.pl{position:absolute;width:18px;margin-left:-9px;border-radius:3px;background:var(--plat);border:1px solid var(--platb)}
.pl.hot{background:var(--orgl);border:2px solid var(--org)}
.sn{all:unset;box-sizing:border-box;display:block;cursor:pointer;position:absolute;left:0;width:78px;text-align:right;margin-top:-14px;font-weight:700;font-size:.95rem;line-height:18px}
.sn.has{color:var(--org)}
.sn:focus-visible{outline:2px solid var(--org);outline-offset:2px;border-radius:4px}
#fleet{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none}
.tr{all:unset;box-sizing:border-box;position:absolute;width:30px;height:14px;border-radius:7px;background:var(--sb);box-shadow:0 0 0 2px var(--card);z-index:2;color:#fff;font:700 9px/14px "Noto Sans TC",sans-serif;text-align:center;cursor:pointer;font-variant-numeric:tabular-nums;transform:translate(-50%,-50%);transition:left 1s ease,top 1s ease;pointer-events:auto}
.tr::after{content:"";position:absolute;inset:-6px}
.tr:focus-visible{outline:2px solid var(--org);outline-offset:3px}
.tr.sel{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink)}
.tr.n{background:var(--nb)}
.tr.w{outline:2px dashed var(--mute);outline-offset:1px}
.tr.icon{height:auto;width:30px;background:none;box-shadow:none;border-radius:0;outline:0}
.tr.icon svg{display:block;width:26px;height:20px;margin:0 auto 1px;filter:drop-shadow(0 1px 1.5px #0006)}
.tr.icon b{display:block;height:14px;border-radius:7px;background:var(--sb);box-shadow:0 0 0 2px var(--card);font:700 9px/14px "Noto Sans TC",sans-serif}
.tr.icon.n b{background:var(--nb)}
.tr.icon.w b{outline:2px dashed var(--mute);outline-offset:1px}
.tr.icon.sel b{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink)}
.ch{position:absolute;left:12px;right:12px;display:flex;flex-wrap:wrap;gap:4px;font-size:.72rem}
.ch span{background:var(--chip);border-radius:6px;padding:3px 8px;white-space:nowrap}
.ch b{color:var(--sb)}.ch .n b{color:var(--nb)}
:root{--plat:#d9d2c3;--platb:#a79f8c;--ptrk:#8d9aa2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--plat:#4a463c;--platb:#7b7463;--ptrk:#6c7c85}}
:root[data-theme="dark"]{--plat:#4a463c;--platb:#7b7463;--ptrk:#6c7c85}
/* 底部抽屜 */
.sh{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;max-height:64vh;overflow:auto;background:var(--card);border-radius:16px 16px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));z-index:10;transform:translateY(110%);visibility:hidden;transition:transform .25s,visibility 0s .25s}
.sh.open{transform:none;visibility:visible;box-shadow:0 -6px 24px rgba(0,0,0,.2);transition:transform .25s}
.shh{display:flex;justify-content:space-between;align-items:center}
.shh b{font-size:1.15rem}
.shh button,#back{all:unset;cursor:pointer;padding:4px 10px;font-size:1rem;color:var(--mute)}
#back{display:block;font-size:.8rem;padding:0 0 6px}
.shh button:focus-visible,#back:focus-visible{outline:2px solid var(--org)}
.sst{margin:6px 0 8px;font-size:.85rem;color:var(--ac,var(--org));font-weight:700}
.sc{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.sc span{background:var(--chip);border-radius:6px;padding:3px 8px;font-size:.74rem}
.sh h3{font-size:.85rem;margin:14px 0 6px}
.sr{display:flex;gap:10px;padding:5px 0;font-size:.9rem;align-items:center;border-top:1px solid var(--ln)}
.sr i{width:10px;height:10px;border-radius:50%;border:3px solid var(--ln);flex:none}
.sr em{font-style:normal;font-variant-numeric:tabular-nums;width:46px;font-weight:700;flex:none}
.sr > span{flex:1}
.sr small{color:var(--mute);font-size:.7rem;text-align:right}
.sr.ps{opacity:.5}.sr.ps i{background:var(--ac,var(--org));border-color:var(--ac,var(--org))}
.sr.cu i{background:var(--ac,var(--org));border-color:var(--ac,var(--org));box-shadow:0 0 0 4px color-mix(in srgb,var(--ac,var(--org)) 25%,transparent)}.sr.cu{color:var(--ac,var(--org));font-weight:700}
.sr.nx i{border-color:var(--ac,var(--org))}
.pt{display:inline-block;background:var(--chip);border:1px solid var(--ln);font-size:.66rem;padding:0 5px;border-radius:4px;margin-left:6px;color:var(--ink);font-weight:400}
.rb{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:center;width:100%;padding:8px 0;border-top:1px solid var(--ln);font-size:.9rem}
.rb:focus-visible{outline:2px solid var(--org)}
.rb.end{color:var(--mute)}
.rb .tm{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}.rb .tm small{display:block;color:var(--mute);font-weight:400;font-size:.68rem}
.none{color:var(--mute);font-size:.8rem;padding:6px 0}
.fc{display:flex;gap:6px;flex-wrap:wrap}
.fc span{border:1.5px solid var(--ok);color:var(--ok);border-radius:99px;padding:2px 10px;font-size:.8rem;font-weight:700}
.cars{display:grid;gap:8px}
.car{display:grid;grid-template-columns:64px 1fr 56px;gap:10px;align-items:center;font-size:.85rem}
.bar{height:10px;background:var(--chip);border-radius:5px;overflow:hidden}.bar div{height:100%}
.fnote{color:var(--mute);font-size:.72rem;margin:8px 0 0;line-height:1.5}
.note{color:var(--mute);font-size:.74rem;margin:12px 2px 0;line-height:1.6}
</style>

 <path d="M14.5 15C18 9.5 28 8 35.5 10.5C37.5 17 35.5 24 29.5 28.5H18.5C13.5 24.5 12 19 14.5 15Z" fill="#2c394a"/>
 <rect x="18" y="23.6" width="5" height="2.6" rx="1" fill="#e6ecf3"/><rect x="26" y="23.6" width="5" height="2.6" rx="1" fill="#e6ecf3"/>
 <ellipse cx="42" cy="14.5" rx="2" ry="3.2" fill="#2c394a"/><ellipse cx="48" cy="15" rx="2" ry="3.2" fill="#2c394a"/><ellipse cx="54" cy="16.5" rx="2" ry="3.2" fill="#2c394a"/>

<main>
<section class="top">
<h1>高鐵全線列車即時位置</h1>
<div class="big"><b id="tot">0</b><span>列(含端點待發)</span><div class="clock" id="clk"></div></div>
<div class="bk">
<div>運行中<b id="run">0</b></div>
<div>端點月台<b id="ter">0</b></div>
<div>南下 / 北上<b id="dr">0 / 0</b></div>
</div>
<div class="tags" aria-live="polite">
  <span id="src" class="tg">載入中…</span>
  <span class="tg unk" id="ops"><i class="ring"></i><span>營運狀態確認中…</span></span>
  <span class="tg ok" id="crowd"><i class="ring"></i><span>無人潮管制資訊</span></span>
</div>
<div class="ctl tabs" role="group" aria-label="方向">
  <button data-f="all" aria-pressed="true">全部</button>
  <button data-f="1" aria-pressed="false">北上</button>
  <button data-f="0" aria-pressed="false">南下</button>
</div>
<form class="search" id="sf" role="search">
  <input id="q" type="search" inputmode="numeric" placeholder="搜尋今日車次（例：123）" aria-label="搜尋車次">
  <button type="submit">查詢</button>
</form>
<div id="qmsg" role="status"></div>
</section>
<div class="lg"><span><i style="background:var(--sb)"></i>南下</span><span><i style="background:var(--nb)"></i>北上</span><span><i style="border:2px dashed var(--mute)"></i>停在端點月台</span></div>
<div class="empty" id="empty" hidden>目前沒有符合條件的行駛中班次</div>
<div class="map" id="map"><div id="mapIn"></div></div>
<section class="sh" id="sheet" role="dialog" aria-modal="true" aria-label="列車詳細資訊"><div id="sheetIn"></div></section>
<p class="note">列車位置依 TDX 時刻表與現在時間推算(非 GPS)。停靠站的列車會停進月台軌並點亮所靠月台;南港、左營以 700T 小圖示意停靠。端點月台指發車前 10 分鐘的待發車,以及到站後 10 分鐘內的列車(皆為假設值)。點選站名可看兩小時內班次,點選列車可看時刻表與自由座車廂。</p>
</main>
<script>
const CID='chris790802-bb9b8edc-adf0-4ac9';
const SEC='612346ff-54e3-4ab7-ad19-44d74771ec35';
const TDX='https://tdx.transportdata.tw';
const ST=[['0990','南港'],['1000','台北'],['1010','板橋'],['1020','桃園'],['1030','新竹'],['1035','苗栗'],['1040','台中'],['1043','彰化'],['1047','雲林'],['1050','嘉義'],['1060','台南'],['1070','左營']];
const IDX=Object.fromEntries(ST.map((s,i)=>[s[0],i]));
const dirArrow=d=>`<i class="ar" style="font-style:normal;font-size:.72em;margin-right:3px;color:var(${d?'--nb':'--sb'})" aria-hidden="true">${d?'▲':'▼'}</i>`;
const FREE_CARS=[10,11,12]; // 備援假設值：TDX 沒資料時才使用
/* TDX「取得高鐵當天所有車次的自由座車廂資料」(THSRApi_DailyFreeSeatingCar)。
   我無法讀取 swagger 頁面，路徑與欄位是推測的；若無法取得資料，請把 swagger 上 Try it out 顯示的
   Request URL（/api/basic/ 之後的部分）貼到下面清單最前面。 */
const FREE_URLS=['/api/basic/v2/Rail/THSR/FreeSeatingCar/Today?$format=JSON','/api/basic/v2/Rail/THSR/DailyFreeSeatingCar/Today?$format=JSON','/api/basic/v2/Rail/THSR/FreeSeatingCar?$format=JSON'];
const freeMap=new Map(); let freeOk=false;
const $=s=>document.querySelector(s);
let trains=[], filter='all', selNo=null;

/* ── 版面設定：各站股道/月台排列（T=股道 P=月台 M=通過線），可自行調整 ── */
const I3="TPTTPTTPT",I2="TPTTPT",TC="TPTMMTPT",SD="PTMMTP";
const LAY=[I3,I2,I2,SD,SD,SD,TC,SD,SD,SD,SD,I3];
const ICON=new Set([0,11]);          // 用 700T 小圖示意停靠的站：南港、左營
const TERM_BEFORE=10, TERM_AFTER=10; // 假設值：起站發車前 10 分鐘進月台、終點站到達後 10 分鐘仍停在月台
const COL=26;                        // 每條股道/月台的欄寬（月台間隔）
const WW=360, CX=78+(WW-78)/2, MX=13, ZT=50, ZB=50, GAP=136; // 底圖寬、中心、主線偏移、上下留白、站間距(GAP 越大站間越長)
const G=[]; let y0=ZT;
LAY.forEach((p,i)=>{
  const W=p.length*COL, x0=CX-W/2, tk=[], pl=[];
  [...p].forEach((c,k)=>{const x=x0+k*COL+COL/2; if(c==='P')pl.push(x); else tk.push({x,m:c==='M'})});
  const H=pl.length>2||i===0||i===11?72:(pl.length===2?66:46);
  G.push({top:y0,H,yc:y0+H/2,W,tk,pl,half:[tk.filter(t=>t.x>CX),tk.filter(t=>t.x<CX)]}); // half[0]=南下(右)、half[1]=北上(左)
  y0+=H+GAP;
});
const MAPH=y0-GAP+ZB;
const CONN=56;                                  // 站外連接線長度（站間灰線 ↔ 月台軌）
const ss=s=>s*s*(3-2*s);                        // 連接線的緩和曲線（列車沿同一條曲線行進）
const lastTrack=new Map();                      // 車次→最近停靠的股道（離站時沿原軌駛出）
const stopTracks=(i,d)=>G[i].half[d].filter(t=>!t.m).sort((a,b)=>Math.abs(a.x-CX)-Math.abs(b.x-CX));
function throughX(i,d){const hf=G[i].half[d],mm=hf.filter(t=>t.m);return mm.length?mm[0].x:hf.reduce((a,t)=>Math.abs(t.x-CX)<Math.abs(a.x-CX)?t:a).x}
const nearPl=(i,x)=>{let b=0,bd=1e9;G[i].pl.forEach((q,j)=>{const dd=Math.abs(q-x);if(dd<bd){bd=dd;b=j}});return b};
const yAt=f=>{const i=Math.min(10,Math.floor(f)),r=f-i;return G[i].yc+(G[i+1].yc-G[i].yc)*r};
// 行駛中列車的 x：站外沿主線，進出站沿連接線滑向該站的股道，站內走股道
function pathX(y,d,txFor){
  const mx=CX+(d?-MX:MX);
  for(let j=0;j<G.length;j++){
    const g=G[j],bot=g.top+g.H;
    if(y>=g.top-CONN&&y<g.top){if(j===0)continue;return mx+(txFor(j)-mx)*ss((y-(g.top-CONN))/CONN)}
    if(y>=g.top&&y<=bot)return txFor(j);
    if(y>bot&&y<=bot+CONN){if(j===G.length-1)continue;return mx+(txFor(j)-mx)*ss((bot+CONN-y)/CONN)}
  }
  return mx;
}
function predictX(i,d){const trk=stopTracks(i,d),sl=dock.get(i+':'+d)||[];let k=sl.length?sl.findIndex(n=>n===null):0;if(k<0)k=trk.length-1;return trk[k].x}

const toMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const fmt=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(Math.floor(m%60)).padStart(2,'0');
const nowMin=()=>{const d=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Taipei'}));return d.getHours()*60+d.getMinutes()+d.getSeconds()/60};

async function getToken(){
  const r=await fetch(TDX+'/auth/realms/TDXConnect/protocol/openid-connect/token',{method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:new URLSearchParams({grant_type:'client_credentials',client_id:CID,client_secret:SEC})});
  const j=await r.json(); if(!j.access_token) throw new Error('token'); return j.access_token;
}

async function load(){
  try{
    const t=await getToken();
    const r=await fetch(TDX+'/api/basic/v2/Rail/THSR/DailyTimetable/Today?$format=JSON',{headers:{authorization:'Bearer '+t}});
    if(!r.ok) throw new Error(r.status);
    const j=await r.json();
    trains=j.map(x=>{const i=x.DailyTrainInfo||x.TrainInfo;return{no:i.TrainNo,dir:i.Direction,
      stops:x.StopTimes.map(s=>({
        i:IDX[s.StationID],
        name:s.StationName.Zh_tw,
        arr:toMin(s.ArrivalTime||s.DepartureTime),
        dep:toMin(s.DepartureTime||s.ArrivalTime),
        platform: s.Platform||''
      })).filter(s=>s.i!==undefined)}});
    setSrc(true);
    loadAlert(t);
    loadFree(t).then(()=>{if($('#sheet').classList.contains('open'))drawSheet()});
  }catch(e){console.warn('TDX 失敗，改用示範資料',e);trains=mock();setSrc(false);setOps('unk','營運狀態未確認')}
}

function setOps(kind,text){const e=$('#ops');e.className='tg '+kind;e.lastElementChild.textContent=text}
async function loadAlert(tok){ // 營運通阻（欄位依記憶撰寫，未實測；失敗時顯示「未確認」而不是假裝正常）
  try{
    const r=await fetch(TDX+'/api/basic/v2/Rail/THSR/AlertInfo?$format=JSON',{headers:{authorization:'Bearer '+tok}});
    if(!r.ok) throw new Error(r.status);
    const j=await r.json(), a=(Array.isArray(j)?j:j.Alerts||[]);
    const bad=a.filter(x=>!(String(x.Status)==='1'||/正常/.test(x.Title||'')));
    if(!bad.length) setOps('ok','全線正常營運');
    else setOps('warn','營運異動：'+(bad[0].Title||'請查看高鐵公告'));
  }catch(e){console.warn('AlertInfo 失敗',e);setOps('unk','營運狀態未確認')}
}
function parseCars(x){ // 欄位名稱不確定：從名稱含 car 的欄位找 1–12 的車廂號
  // 「幾節自由座」這類數量欄位（如 3、4）會被誤認成車廂號，所以：排除 count/total 類欄位，
  // 且依序優先採用 陣列/物件 → 字串("10,11,12"、"10-12") → 單一數字，前面有結果就不看後面。
  const grab=(v,out)=>{
    if(typeof v==='number'){if(v>=1&&v<=12)out.add(v)}
    else if(typeof v==='string'){
      v=v.replace(/(\d+)\s*[-~～至]\s*(\d+)/g,(m,a,b)=>{for(let c=+a;c<=+b;c++)if(c>=1&&c<=12)out.add(c);return ' '});
      v.split(/\D+/).forEach(n=>{n=parseInt(n,10);if(n>=1&&n<=12)out.add(n)});
    }
    else if(Array.isArray(v))v.forEach(e=>grab(e,out));
    else if(v&&typeof v==='object')Object.values(v).forEach(e=>grab(e,out));
  };
  const skip=/count|total|qty|quantity|numberof|numof|sum|length/i;
  const tiers=[new Set(),new Set(),new Set()];
  Object.entries(x).forEach(([k,v])=>{
    if(!/car/i.test(k)||skip.test(k)) return;
    grab(v,tiers[v&&typeof v==='object'?0:typeof v==='string'?1:2]);
  });
  const hit=tiers.find(t=>t.size);
  return hit?[...hit].sort((a,b)=>a-b):[];
}
async function loadFree(tok){
  for(const u of FREE_URLS){
    try{
      const r=await fetch(TDX+u,{headers:{authorization:'Bearer '+tok}});
      if(!r.ok) continue;
      const j=await r.json(), arr=Array.isArray(j)?j:(j.FreeSeatingCars||j.Trains||[]);
      console.log('自由座原始資料範例（欄位對不上時請貼給我）',u,arr[0]);
      arr.forEach(x=>{
        const no=x.TrainNo||(x.DailyTrainInfo&&x.DailyTrainInfo.TrainNo)||(x.TrainInfo&&x.TrainInfo.TrainNo);
        const cars=parseCars(x); if(no&&cars.length) freeMap.set(String(parseInt(no,10)),cars);
      });
      if(freeMap.size){freeOk=true;return}
    }catch(e){console.warn('自由座 API 失敗',u,e)}
  }
}
function freeHtml(t){
  const real=freeMap.get(String(parseInt(t.no,10)));
  if(real) return `<div class="fc">${real.map(c=>`<span>${c} 號車廂</span>`).join('')}</div>
    <p class="fnote">資料來源：TDX 自由座車廂資料；實際開放車廂以月台公告為準。</p>`;
  const bars=freeCars(t).map(c=>`<div class="car"><b>${c.c} 號車廂</b><div class="bar"><div style="width:${c.pct}%;background:${c.col}"></div></div><span>${c.txt}</span></div>`).join('');
  return `<div class="cars">${bars}</div><p class="fnote">${freeOk?'TDX 資料中找不到本班車':'尚未取得 TDX 自由座資料'}，以上車廂與擁擠度為假設值，請以高鐵官方與站內公告為準。</p>`;
}
function setSrc(ok){const b=$('#src');b.textContent=ok?'TDX 時刻表':'示範資料（TDX 連線失敗）';b.className='tg '+(ok?'live':'demo')}
function mock(){
  const cum=[0,9,19,29,44,57,71,81,91,106,124,138],skip=[[],[2,5,8],[2,3,5,8,9]],out=[];
  for(let k=0;k<70;k++)for(const dir of[0,1]){
    const start=330+k*14+(dir?7:0),sk=skip[k%3],idx=ST.map((_,i)=>i).filter(i=>i===0||i===11||!sk.includes(i));
    if(dir)idx.reverse();
    const stops=idx.map(i=>{
      const m=dir?start+138-cum[i]:start+cum[i];const first=i===idx[0],last=i===idx[idx.length-1];
      return{i,name:ST[i][1],arr:m,dep:m+(first||last?0:1),platform: dir===0?'第 2 月台':'第 1 月台'}
    });
    out.push({no:String((k%9+1)*100+Math.floor(k/9)*2+(dir?0:1)),dir,stops});
  }return out;
}

function locate(t,now){
  const s=t.stops,L=s.length-1;
  for(let k=0;k<=L;k++){
    // 起站：發車前 TERM_BEFORE 分鐘已在月台；終點站：到達後 TERM_AFTER 分鐘仍在月台（時刻表沒有這段，屬假設值）
    const a=s[k].arr-(k===0?TERM_BEFORE:0), d=s[k].dep+(k===L?TERM_AFTER:0);
    if(now>=a&&now<=d) return{at:s[k].i,f:s[k].i,k};
    if(k<L&&now>s[k].dep&&now<s[k+1].arr){
      const p=(now-s[k].dep)/(s[k+1].arr-s[k].dep),f=s[k].i+(s[k+1].i-s[k].i)*p;
      return{f,k,next:k+1};
    }
  }return null;
}
function segLabel(t,p){
  if(p.at!==undefined) return '停靠 '+ST[p.at][1];
  const lo=Math.min(Math.floor(p.f),10),hi=lo+1;
  return t.dir===0?ST[lo][1]+'→'+ST[hi][1]:ST[hi][1]+'→'+ST[lo][1];
}
function freeCars(t){
  const nums=FREE_CARS,h=parseInt(t.no,10)||1;
  return nums.map((c,i)=>{const pct=(h*(c+7)*37+i*19)%66+25;
    return{c,pct,txt:pct<50?'空位多':pct<75?'尚有座位':'擁擠',col:pct<50?'var(--ok)':pct<75?'var(--warn)':'var(--bad)'}});
}
// 是否停在端點月台（起站待發 / 終點到站）
const isTerm=(t,p,now)=>{if(p.at===undefined)return false;const L=t.stops.length-1;return (p.k===0&&now<t.stops[0].dep)||(p.k===L&&now>=t.stops[L].arr)};

/* ── 底圖（只畫一次） ── */
function buildMap(){
  let b=`<div class="ln" style="left:${CX-MX}px;top:${G[0].yc}px;height:${G[11].yc-G[0].yc}px"></div><div class="ln" style="left:${CX+MX}px;top:${G[0].yc}px;height:${G[11].yc-G[0].yc}px"></div>`;
  let cv='';
  const curve=(mx,tx,yEdge,dirY)=>{let pts=[];for(let n=0;n<=10;n++){const u=n/10;pts.push((mx+(tx-mx)*ss(1-u)).toFixed(1)+','+(yEdge+dirY*CONN*u).toFixed(1))}return pts.join(' ')};
  G.forEach((g,i)=>g.tk.forEach(k=>{
    const mx=CX+(k.x<CX?-MX:MX); if(Math.abs(k.x-mx)<1)return;
    const col=k.m?'var(--ln)':'var(--ptrk)';
    if(i>0)cv+=`<polyline points="${curve(mx,k.x,g.top,-1)}" stroke="${col}"/>`;
    if(i<G.length-1)cv+=`<polyline points="${curve(mx,k.x,g.top+g.H,1)}" stroke="${col}"/>`;
  }));
  b+=`<svg width="${WW}" height="${MAPH}" style="position:absolute;left:0;top:0;pointer-events:none" fill="none" stroke-width="4" aria-hidden="true">${cv}</svg>`;
  G.forEach((g,i)=>{
    b+=`<div class="sb" style="left:${CX-g.W/2-6}px;width:${g.W+12}px;top:${g.top}px;height:${g.H}px"></div>`;
    g.tk.forEach(k=>{b+=`<div class="tk${k.m?' m':''}" style="left:${k.x}px;top:${g.top}px;height:${g.H}px"></div>`});
    g.pl.forEach((q,j)=>{b+=`<div class="pl" id="pl-${i}-${j}" style="left:${q}px;top:${g.top+8}px;height:${g.H-16}px"></div>`});
    b+=`<button class="sn" data-i="${i}" style="top:${g.yc}px" aria-label="${ST[i][1]}站 未來兩小時車次">${ST[i][1]}</button>`;
  });
  b+='<div class="ch" id="chT" style="top:8px"></div><div class="ch" id="chB" style="bottom:8px"></div><div id="fleet"></div>';
  const m=$('#mapIn'); m.style.width=WW+'px'; m.style.height=MAPH+'px'; m.innerHTML=b;
  document.querySelectorAll('.sn').forEach(x=>x.onclick=()=>openStation(+x.dataset.i));
}
function fit(){ // 窄螢幕等比縮小
  const m=$('#map'),w=m.clientWidth,s=Math.min(1,w/WW),inn=$('#mapIn');
  inn.style.transform=`scale(${s})`; inn.style.marginLeft=Math.max(0,(w-WW*s)/2)+'px'; m.style.height=MAPH*s+'px';
}

/* ── 抽屜 ── */
let sheetMode='train', selSt=0, fromSt=null;
function openTrain(no,from=null){selNo=no;sheetMode='train';fromSt=from;drawSheet();$('#sheet').classList.add('open');render()}
function openStation(i){selSt=i;sheetMode='station';fromSt=null;selNo=null;drawSheet();$('#sheet').classList.add('open');render()}
function closeSheet(){$('#sheet').classList.remove('open');selNo=null;render()}
function drawSheet(){ sheetMode==='station'?drawStation():drawTrain(); }
function drawStation(){
  const i=selSt, now=nowMin(), items=[];
  trains.forEach(t=>{
    const k=t.stops.findIndex(x=>x.i===i); if(k<0)return;
    const s=t.stops[k], isEnd=k===t.stops.length-1, tm=isEnd?s.arr:s.dep;
    if(tm>=now&&tm<=now+120) items.push({t,s,isEnd,tm,end:t.stops[t.stops.length-1].name});
  });
  const sec=dir=>{
    const list=items.filter(x=>x.t.dir===dir).sort((a,b)=>a.tm-b.tm);
    return`<h3>${dirArrow(dir)}${dir?'北上':'南下'}　<span style="color:var(--mute);font-weight:400">${list.length} 班</span></h3>`+
      (list.length?list.map(x=>`<button class="rb${x.isEnd?' end':''}" onclick="openTrain('${x.t.no}',${i})">
        <b>${dirArrow(dir)}${x.t.no} 次</b>
        <span>${x.isEnd?'本站為終點':'往 '+x.end}${x.s.platform?`<span class="pt">${x.s.platform}</span>`:''}</span>
        <span class="tm">${fmt(x.tm)}<small>${x.isEnd?'到站':'發車'}</small></span></button>`).join('')
        :'<div class="none">兩小時內沒有班次</div>');
  };
  $('#sheet').style.setProperty('--ac','var(--org)');
  $('#sheetIn').innerHTML=`<div class="shh"><b>${ST[i][1]}站</b><button id="close" aria-label="關閉">✕</button></div>
    <div class="sst">現在 ${fmt(now)} 起兩小時內的車次</div>`+sec(1)+sec(0);
  $('#close').onclick=closeSheet;
}
function drawTrain(){
  const t=trains.find(x=>x.no===selNo); if(!t)return;
  const now=nowMin(),p=locate(t,now),first=t.stops[0],L=t.stops.length-1,last=t.stops[L];
  const cur=p?p.k:-1,atStn=p&&p.at!==undefined;
  let st;
  if(!p) st=now<first.dep?`尚未進站，${fmt(first.dep)} 發車`:'本班已結束運行';
  else if(atStn) st=p.k===0&&now<first.dep?`端點待發，約 ${Math.ceil(first.dep-now)} 分後發車`:p.k===L?`已到站 ${last.name}`:`停靠 ${ST[p.at][1]}`;
  else st=`運行中 · ${segLabel(t,p)} · 下一站 ${t.stops[p.next].name} ${fmt(t.stops[p.next].arr)}`;
  const rows=t.stops.map((s,k)=>{
    const cls=!p?'':atStn&&k===cur?'cu':!atStn&&k===p.next?'nx':k<(atStn?cur:p.next)?'ps':'';
    const f=k===0,l=k===L;
    return`<div class="sr ${cls}"><i></i><em>${l?fmt(s.arr):fmt(s.dep)}</em><span>${s.name}${cls==='cu'?'（停靠中）':cls==='nx'?'（下一站）':''}${s.platform?`<span class="pt">${s.platform}</span>`:''}</span>
      <small>${f?'起站發車':l?'到達':'到 '+fmt(s.arr)}</small></div>`}).join('');
  $('#sheet').style.setProperty('--ac',t.dir?'var(--nb)':'var(--sb)');
  $('#sheetIn').innerHTML=`${fromSt!==null?'<button id="back">‹ 返回'+ST[fromSt][1]+'站</button>':''}
    <div class="shh"><b>${dirArrow(t.dir)}${t.no} 次 ${t.dir?'北上':'南下'}</b><button id="close" aria-label="關閉">✕</button></div>
    <div class="sst">${st}</div>
    <div class="sc"><span>${first.name} ${fmt(first.dep)} → ${last.name} ${fmt(last.arr)}</span><span>停靠 ${t.stops.length} 站</span></div>
    ${rows}<h3>自由座車廂</h3>${freeHtml(t)}`;
  $('#close').onclick=closeSheet;
  if(fromSt!==null)$('#back').onclick=()=>openStation(fromSt);
}

/* ── 渲染 ── */
const fleet=new Map(), dock=new Map();   // 車次→元素；'站:方向'→月台軌佔用（穩定分配，列車不會在軌道間跳來跳去）
function render(){
  const now=nowMin(), F=$('#fleet');
  const allLive=trains.map(t=>({t,p:locate(t,now)})).filter(x=>x.p);
  const vis=x=>filter==='all'||String(x.t.dir)===filter;
  let run=0,ter=0,sb=0,nb=0;
  allLive.forEach(({t,p})=>{isTerm(t,p,now)?ter++:run++;t.dir?nb++:sb++});
  $('#tot').textContent=allLive.length; $('#run').textContent=run; $('#ter').textContent=ter; $('#dr').textContent=sb+' / '+nb;
  $('#clk').textContent=fmt(now);
  $('#empty').hidden=allLive.some(vis);

  document.querySelectorAll('.pl.hot').forEach(e=>e.classList.remove('hot'));
  document.querySelectorAll('.sn.has').forEach(e=>e.classList.remove('has'));
  const names=document.querySelectorAll('.sn'), chips=['',''], seen=new Set(), byNo=(a,b)=>(parseInt(a.t.no,10)||0)-(parseInt(b.t.no,10)||0);

  function put(t,p,o){
    let b=fleet.get(t.no);
    if(!b){b=document.createElement('button');b.onclick=()=>openTrain(t.no);fleet.set(t.no,b);F.appendChild(b)}
    seen.add(t.no);
    b.className='tr'+(t.dir?' n':'')+(o.icon?' icon':'')+(o.w?' w':'')+(selNo===t.no?' sel':'');
    b.style.left=o.x+'px'; b.style.top=o.y+'px';
    const h=o.icon?`<svg viewBox="0 0 60 46" aria-hidden="true"><use href="#t700"/></svg><b>${t.no}</b>`:t.no;
    if(b._h!==h){b.innerHTML=h;b._h=h}
    b.setAttribute('aria-label',`${t.no}次 ${t.dir?'北上':'南下'} ${segLabel(t,p)}`);
  }

  const stopped=new Map(), moving=[];
  allLive.forEach(x=>{
    const {t,p}=x;
    if(p.at!==undefined){const key=p.at+':'+t.dir; if(!stopped.has(key))stopped.set(key,[]); stopped.get(key).push(x)}
    else if(vis(x)) moving.push(x);
  });

  dock.forEach((slots,key)=>{const ns=(stopped.get(key)||[]).map(x=>x.t.no);slots.forEach((n,k)=>{if(n!==null&&!ns.includes(n))slots[k]=null})});
  stopped.forEach((list,key)=>{
    const [i,dir]=key.split(':').map(Number), trk=stopTracks(i,dir), icon=ICON.has(i);
    if(!dock.has(key))dock.set(key,Array(trk.length).fill(null));
    const slots=dock.get(key); let over=0;
    list.sort(byNo).forEach(x=>{
      const {t,p}=x; let k=slots.indexOf(t.no), dy=0;
      if(k<0){k=slots.indexOf(null);if(k>=0)slots[k]=t.no}
      if(k<0){const j=over++;k=trk.length-1;dy=(j%2?1:-1)*(Math.floor(j/2)+1)*(icon?40:22)}   // 軌位不夠時沿軌道錯開
      if(!vis(x))return;
      const tx=trk[k].x, w=isTerm(t,p,now);
      names[i].classList.add('has');
      document.getElementById(`pl-${i}-${nearPl(i,tx)}`)?.classList.add('hot');
      lastTrack.set(t.no,{i,x:tx});
      put(t,p,{x:tx,y:G[i].yc+dy,icon,w});
      if(w&&(i===0||i===11)){
        const L=t.stops.length-1, n=t.dir?'':'';
        chips[i?1:0]+=`<span class="${t.dir?'n':''}"><b>${t.no}</b> ${p.k===0?(t.dir?'北上':'南下')+'待發 '+fmt(t.stops[0].dep):fmt(t.stops[L].arr)+' 已到站'}</span>`;
      }
    });
  });
  moving.forEach(({t,p})=>{ // 行駛中：沿主線與連接線
    const a=t.stops[p.k].i, b=t.stops[p.next].i, y=yAt(p.f), lt=lastTrack.get(t.no);
    const depX=lt&&lt.i===a?lt.x:stopTracks(a,t.dir)[0].x, arrX=predictX(b,t.dir);
    put(t,p,{x:pathX(y,t.dir,j=>j===a?depX:j===b?arrX:throughX(j,t.dir)),y});
  });
  $('#chT').innerHTML=chips[0]; $('#chB').innerHTML=chips[1];
  fleet.forEach((b,no)=>{if(!seen.has(no)){b.remove();fleet.delete(no)}});
  if($('#sheet').classList.contains('open')) drawSheet();
}

document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  filter=b.dataset.f;document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
$('#sf').onsubmit=e=>{
  e.preventDefault();
  const n=parseInt($('#q').value.trim(),10),msg=$('#qmsg');
  if(isNaN(n)){msg.textContent='請輸入數字車次';return}
  const t=trains.find(x=>parseInt(x.no,10)===n);
  if(!t){msg.textContent='今日沒有 '+n+' 次車';return}
  msg.textContent='';openTrain(t.no);
};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
window.addEventListener('resize',fit);
buildMap(); fit();
load().then(()=>{render();setInterval(render,15000);setInterval(load,3600000)});
</script>
